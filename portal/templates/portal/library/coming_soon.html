{% extends "portal/base.html" %}
{% load i18n %}

{% block title %}{{ title }}{% endblock %}

{% block breadcrumb %}
<a href="{% url 'portal:home' %}">{% trans "首页" %}</a>
<span>/</span>
<a href="{% url 'portal:library_home' %}">{% trans "资料库" %}</a>
<span>/</span>
<span>{{ title }}</span>
{% endblock %}

{% block content %}
<div class="portal-page-header">
    <div>
        <h1>{{ title }}</h1>
        <p>{{ description }}</p>
    </div>
</div>

<div class="portal-panel">
    <div class="empty-cell">
        {% trans "这个页面下一步接入列表和搜索功能。" %}
    </div>
</div>
{% endblock %}
