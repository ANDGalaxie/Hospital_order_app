services:
  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acoeur_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ocr:
        condition: service_healthy
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      ACOEUR_OCR_SERVICE_URL: "http://ocr:8765/ocr"
      ACOEUR_OCR_SERVICE_TIMEOUT: "1800"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./outputs:/app/outputs
      - ./data:/app/data

  ocr:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: acoeur_ocr
    restart: unless-stopped
    command: ["python", "scripts/ocr_service.py"]
    environment:
      ACOEUR_OCR_HOST: "0.0.0.0"
      ACOEUR_OCR_PORT: "8765"
      ACOEUR_OCR_LANG: "${ACOEUR_OCR_LANG:-fr}"
      ACOEUR_OCR_ZOOM: "${ACOEUR_OCR_ZOOM:-3.0555555555555554}"
      ACOEUR_OCR_DET_LIMIT_TYPE: "${ACOEUR_OCR_DET_LIMIT_TYPE:-max}"
      ACOEUR_OCR_DET_LIMIT_SIDE_LEN: "${ACOEUR_OCR_DET_LIMIT_SIDE_LEN:-960}"
      ACOEUR_CONTAINER_MEDIA_ROOT: "/app/media"
      ACOEUR_HOST_MEDIA_ROOT: "/app/media"
      PADDLE_PDX_CACHE_HOME: "/models/paddlex"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    volumes:
      - ./media:/app/media
      - ocr_models:/models
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s

  db:
    image: postgres:16
    container_name: acoeur_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hospital_orders
      POSTGRES_USER: hospital_user
      POSTGRES_PASSWORD: hospital_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital_user -d hospital_orders"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  ocr_models:
